<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dish Explorer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>

<body>




  <header class="bg-primary py-5">

    <div class="container px-4 px-lg-5 my-5">

      <div class="text-center text-white">

        <h1 class="display-4 fw-bolder text-dark">
          Delicious Dishes
        </h1>

        <p class="lead fw-normal text-dark mb-0 ">
          Explore delicious dishes from around the world
        </p>

      </div>

    </div>

  </header>





  <section class="py-5">

    <div class="container px-4 px-lg-5 mt-5">

      <div id="output" class="row gx-4 gx-lg-5 row-cols-1 row-cols-md-2 row-cols-xl-3 justify-content-center">

      </div>

    </div>

  </section>









  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>




  <script>
    

    const display = document.getElementById('output');


    fetch("https://dummyjson.com/recipes")

      .then(res => res.json())

      .then(result => {

        console.log(result);

        let dishes = result.recipes;


        dishes.forEach(dish => {

          display.innerHTML += `

                    <div class="col mb-5">

                        <div class="card h-100 shadow-sm">

                            <!-- Dish Image -->

                           <img
                      class="card-img-top"
                      src="${dish.image}"
                      alt="${dish.name}"
                      style="height: 250px; object-fit: cover;"
>


                            <!-- Dish Details -->

                            <div class="card-body p-4">

                                <div class="text-center">

                                    <h5 class="fw-bolder">
                                        ${dish.name}
                                    </h5>


                                    <p class="text-muted mb-0">
                                        ${dish.cuisine}
                                    </p>


                                    <p class="text-muted">
                                        ${dish.mealType}
                                    </p>

                                </div>

                            </div>


                            <!-- Button -->

                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">

                                <div class="text-center">

                                    
                  <button
                  class="btn btn-primary"
                  type="button"
                  onclick="showRecipe(${dish.id})"
                      >
                       View
                       </button>

                                </div>

                            </div>

                        </div>

                    </div>

                `;

        });

      })


      .catch(error => {

        console.log(error);

        display.innerHTML = `

                <h3 class="text-center text-danger">
                    Failed to load dishes
                </h3>

            `;

      });

  </script>
  ```

</body>

</html>
